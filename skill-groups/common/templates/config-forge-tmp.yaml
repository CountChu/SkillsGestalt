# Configuration of a Forge: an agency that uses the common skill group of SkillsGestalt, the Gestalt.
# Copy this file to config.shared.yaml at the root of the workspace, and replace {WORK_BRANCH}, the work branch of this clone.
# Each {camelCase} placeholder stays: gen_config.py fills it from config.local.yaml, which gives the values of each computer.
# The steps to make a Forge are in {skillGroups.common}/references/forge-setup.md.
# A relative path starts at the root of the workspace; a path can start with ~, the home directory.
# Keep the quotes around a value that starts with {: without them, YAML reads it as a mapping.
# The terms agency, Gestalt, Forge, wiki and skill group are in {skillGroups.common}/references/glossary.md.

wikiDir: "{wikiDir}"              # the Obsidian vault of this agency, where its skills write notes and reports
wikiRootDir: "{wikiRootDir}"      # the folder that holds the vaults of all the agencies; a check of a wikilink looks in all of it
skillGroups:
  common: "{gestaltRoot}/skill-groups/common"    # the common skill group of SkillsGestalt: skills, rules, templates and scripts
  dedi: .claude                             # the skills of this agency only, in .claude/skills/
  external:                                 # skills from outside the agencies, if any
agencies:
  SkillsGestalt: "{gestaltRoot}"            # the root of SkillsGestalt: check_chores.py finds there the chores this agency does
# tasksDir: "{wikiDir}/tasks"                         # set only if the tasks are not in tasks/ at the root, for example in the vault
# taskSummary: "{wikiDir}/dashboard/task-summary.md"  # set only if the summary table is not dashboard/task-summary.md at the root; it does not have to be beside tasksDir
# choreSummary: "{wikiDir}/dashboard/chore-summary.md" # set only if the chore summary table is not dashboard/chore-summary.md at the root
workBranches:                             # the work branch of each clone of this agency; a new clone adds its own, never a computer name
  - "{WORK_BRANCH}"
workBranch: "{workBranch}"                # the work branch of this clone, from config.local.yaml; gen_agents_md.py stops without it
keepEnglishChore: keep-english              # the chore that audits the 繁體中文 twins when tw-keep-english.md changes; AGENTS.md links it. Remove the line if this agency does not do it
