# Workspace configuration of SkillsGestalt: the skills that run here read it in their Step 0.
# gen_config.py makes config.yaml at the workspace root from this file and config.local.yaml. config.yaml and config.local.yaml are not in git.
# Each {name} below is the value of name in config.local.yaml, such as  wikiDir: D:/Notes/MyVault
# Write a path in config.local.yaml with /, not \: the value goes into double quotes here.
# A relative path is relative to the workspace root, where this file is.
wikiDir: "{wikiDir}"   # the Obsidian vault for the MD reports, and the Skills Dashboard in dashboard/skills.md; vaultName is its last path segment
skillGroups:
  common: skill-groups/common       # the shared skills, rules, templates and scripts that every workspace uses
  external: skill-groups/external   # skills that come from outside
keepEnglishChore: keep-english   # the chore that audits the 繁體中文 twins when tw-keep-english.md changes its version; AGENTS.md links it
# cleanCheckpoints:         # the clean-checkpoints skill; without it, or without a key, the default of the key applies
#   maxSizeGB: 10             # the skill cleans only when checkpoints\ is larger than this size
#   keepDays: 60              # an item is old when its newest file is older than this number of days
#   keep: [some-skill]        # the skill folders in checkpoints\ that a different skill reads, never cleaned
# identity:                 # the author and committer of each snapshot that publish-gestalt makes; without it, IDENTITY in publish_snapshot.py
#   name: Your Name
#   email: you@example.com
# publish:                  # only for a Forge that publishes itself as publish-gestalt does; SkillsGestalt has no such section, and publish_snapshot.py uses its own values
#   name: MyForge             # the first word of the subject of a snapshot
#   branch: release           # the local branch of the releases
#   remote: origin
#   remoteBranch: users/me/release
#   excluded: []              # the paths that a snapshot leaves out
#   privatePaths: ['^checkpoints/', '^temp/']   # regular expressions: a path that must not be in the tree
#   scans: [email, token]     # some of email, privateIP, ado, home, token, keyword
#   emailAllowed: [example.org]   # more domains whose email addresses are not a finding
